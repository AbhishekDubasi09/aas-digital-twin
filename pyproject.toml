[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aas-digital-twin"
version = "0.1.0"
description = "Industrie 4.0 digital twin implementing a real Asset Administration Shell (IEC 63278-1) over OPC UA and MQTT"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Abhishek" }]
dependencies = [
    "asyncua==1.1.5",
    "basyx-python-sdk==1.1.0",
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "paho-mqtt==2.1.0",
    "numpy==1.26.4",
    "matplotlib==3.9.2",
    "pydantic==2.9.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "black==24.8.0",
    "ruff==0.6.9",
    "mypy==1.11.2",
    "pre-commit==3.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
